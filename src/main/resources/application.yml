spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      # 데이터베이스의 스키마와 jpa 엔티티가 불일치할때 애플리케이션 실행 중단
      ddl-auto: validate
    properties:
      hibernate:
        # 1초 넘는 쿼리는 WARN으로 남겨 슬로우 쿼리 추적
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 1000

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  datasource:
    hikari:
      connectionTimeout: '30000'
      maximum-pool-size: '10'
      max-lifetime: '1800000'
      # 5초 동안 반환 안 된 커넥션은 WARN — 트랜잭션 누수 즉시 감지
      leak-detection-threshold: '5000'
    url: ${LOCAL_MYSQL_URL}               # ex) jdbc:mysql://localhost:3306/qcheck
    username: ${LOCAL_MYSQL_USER}         # MySQL 사용자명
    password: ${LOCAL_MYSQL_PASSWORD}     # MySQL 비밀번호
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    tags:
      application: qcheck

dev-auth:
  enabled: true  # X-USER-ID 헤더 인증 허용 여부. 로컬 개발 전용, 프로덕션에서는 반드시 false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}  # 쉼표 구분, ex) http://localhost:3000,https://qcheck.example.com

discord:
  client-id: ${DISCORD_CLIENT_ID}         # Discord 애플리케이션 Client ID
  client-secret: ${DISCORD_CLIENT_SECRET} # Discord 애플리케이션 Client Secret
  redirect-uri: ${DISCORD_REDIRECT_URI}   # ex) http://localhost:8080/api/auth/code (Discord 앱에 등록 필요)
  oauth-url: https://discord.com/oauth2/authorize
  token-url: https://discord.com/api/oauth2/token
  user-url: https://discord.com/api/users/@me

frontend:
  # OAuth 처리 후 토큰을 query string으로 실어 redirect 할 프론트 콜백 URL
  # ex) https://qcheck.asia/auth/callback (프론트 라우트 경로 확정되면 갱신)
  auth-callback-url: ${FRONTEND_AUTH_CALLBACK_URL}

jwt:
  secret: ${JWT_SECRET}                  # HMAC-SHA256 서명 키, 최소 32자 이상
  access-token-expiration: 3600000       # 1시간 (ms)
  refresh-token-expiration: 604800000    # 7일 (ms)
  signup-token-expiration: 600000        # 10분 (ms)
