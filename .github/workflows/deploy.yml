name: Deploy to Self-hosted Runner

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create .env file
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_REDIRECT_URI: ${{ secrets.DISCORD_REDIRECT_URI }}
          FRONTEND_AUTH_CALLBACK_URL: ${{ secrets.FRONTEND_AUTH_CALLBACK_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          cat > .env << EOF
          MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
          MYSQL_USER=${MYSQL_USER}
          MYSQL_PASSWORD=${MYSQL_PASSWORD}
          DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
          DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
          DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI}
          FRONTEND_AUTH_CALLBACK_URL=${FRONTEND_AUTH_CALLBACK_URL}
          JWT_SECRET=${JWT_SECRET}
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test --no-daemon

      - name: Stop existing containers
        run: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml down || true

      - name: Build and start containers
        run: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d --build

      - name: Health check
        run: |
          echo "Waiting for application to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1 || curl -sf http://localhost:8080/swagger-ui.html > /dev/null 2>&1; then
              echo "Application is up!"
              exit 0
            fi
            sleep 5
          done
          echo "Application failed to start"
          docker compose logs app
          exit 1
